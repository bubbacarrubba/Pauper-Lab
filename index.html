<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-hover: #2a2a2a;
            --primary-color: #3b82f6;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #374151;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .icon-btn:hover {
            background-color: var(--surface-hover);
        }

        .deck-title-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Sub Navigation Tabs */
        .sub-nav {
            display: flex;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
        }

        .sub-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .sub-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* Content Area */
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* List Styling */
        .card-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: var(--surface-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .card-qty {
            font-weight: bold;
            color: var(--primary-color);
            min-width: 24px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            background-color: var(--surface-hover);
            color: var(--text-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 32px 16px;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="top-bar">
        <!-- FRECCIA IN ALTO A SINISTRA COLLEGATA ALLA HOME -->
        <button class="icon-btn" onclick="tornaAllaHome()">←</button>
        <div class="deck-title-container">
            <h1 id="deckTitle" style="font-size: 1.1rem;">Mazzo Principale</h1>
        </div>
        <button class="icon-btn" onclick="openAddModal()">+</button>
    </div>

    <!-- SUB NAVIGATION -->
    <div class="sub-nav">
        <button class="sub-tab active" id="tab-lista" onclick="switchSubTab('lista', this)">Lista</button>
        <button class="sub-tab" id="tab-sideboard" onclick="switchSubTab('sideboard', this)">Sideboard</button>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="container">
        <!-- LISTA TAB -->
        <div id="view-lista" class="tab-content active">
            <ul class="card-list" id="mainDeckList"></ul>
            <button class="btn btn-primary btn-add" onclick="openAddModal('main')">+ Aggiungi Carta</button>
        </div>

        <!-- SIDEBOARD TAB -->
        <div id="view-sideboard" class="tab-content">
            <ul class="card-list" id="sideboardList"></ul>
            <button class="btn btn-primary btn-add" onclick="openAddModal('sideboard')">+ Aggiungi a Sideboard</button>
        </div>
    </div>

    <!-- MODALE AGGIUNTA CARTA -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal">
            <div class="modal-header" id="modalTitle">Aggiungi Carta</div>
            <div class="form-group">
                <label for="cardName">Nome Carta</label>
                <input type="text" id="cardName" placeholder="Es. Lightning Bolt">
            </div>
            <div class="form-group">
                <label for="cardQty">Quantità</label>
                <input type="number" id="cardQty" value="1" min="1" max="99">
            </div>
            <input type="hidden" id="targetSection" value="main">
            <div class="modal-actions">
                <button class="btn" onclick="closeAddModal()">Annulla</button>
                <button class="btn btn-primary" onclick="saveCard()">Salva</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-item active" id="navHome" onclick="tornaAllaHome()">
            <span>🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-item" id="navSide" onclick="switchSubTab('sideboard', document.getElementById('tab-sideboard')); setNavActive(this);">
            <span>📋</span>
            <span>Sideboard</span>
        </button>
    </div>

    <script>
        // Stato dell'applicazione
        let deckData = {
            main: [
                { id: 1, name: "Lightning Bolt", qty: 4 },
                { id: 2, name: "Counterspell", qty: 4 }
            ],
            sideboard: [
                { id: 3, name: "Relic of Progenitus", qty: 2 }
            ]
        };

        // Rende la freccia in alto a sinistra un link diretto alla Home
        function tornaAllaHome() {
            // Chiude eventuali modali aperte
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            
            // Riporta la vista sulla scheda 'Lista' e imposta attiva la Home
            switchSubTab('lista', document.getElementById('tab-lista'));
            setNavActive(document.getElementById('navHome'));
        }

        // Cambio Schede (Lista / Sideboard)
        function switchSubTab(tabName, element) {
            document.querySelectorAll('.sub-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (element) element.classList.add('active');
            
            const targetView = document.getElementById('view-' + tabName);
            if (targetView) targetView.classList.add('active');

            // Sincronizza stato navigazione inferiore
            if (tabName === 'lista') {
                setNavActive(document.getElementById('navHome'));
            } else if (tabName === 'sideboard') {
                setNavActive(document.getElementById('navSide'));
            }
        }

        function setNavActive(element) {
            if (!element) return;
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            element.classList.add('active');
        }

        // Render Liste
        function renderLists() {
            renderSection('main', 'mainDeckList');
            renderSection('sideboard', 'sideboardList');
        }

        function renderSection(sectionKey, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            if (deckData[sectionKey].length === 0) {
                container.innerHTML = '<div class="empty-state">Nessuna carta presente.</div>';
                return;
            }

            deckData[sectionKey].forEach(card => {
                const li = document.createElement('li');
                li.className = 'card-item';
                li.innerHTML = `
                    <div class="card-info">
                        <span class="card-qty">${card.qty}x</span>
                        <span class="card-name">${card.name}</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn" onclick="updateQty('${sectionKey}', ${card.id}, -1)">-</button>
                        <button class="btn" onclick="updateQty('${sectionKey}', ${card.id}, 1)">+</button>
                        <button class="btn btn-danger" onclick="deleteCard('${sectionKey}', ${card.id})">✕</button>
                    </div>
                `;
                container.appendChild(li);
            });
        }

        // Gestione Quantità e Cancellazione
        function updateQty(section, id, delta) {
            const card = deckData[section].find(c => c.id === id);
            if (card) {
                card.qty += delta;
                if (card.qty <= 0) {
                    deleteCard(section, id);
                } else {
                    renderLists();
                }
            }
        }

        function deleteCard(section, id) {
            deckData[section] = deckData[section].filter(c => c.id !== id);
            renderLists();
        }

        // Gestione Modale
        function openAddModal(target = 'main') {
            document.getElementById('targetSection').value = target;
            document.getElementById('modalTitle').innerText = target === 'sideboard' ? 'Aggiungi a Sideboard' : 'Aggiungi Carta';
            document.getElementById('cardName').value = '';
            document.getElementById('cardQty').value = '1';
            document.getElementById('cardModal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('cardModal').style.display = 'none';
        }

        function saveCard() {
            const name = document.getElementById('cardName').value.trim();
            const qty = parseInt(document.getElementById('cardQty').value, 10);
            const section = document.getElementById('targetSection').value;

            if (!name || isNaN(qty) || qty < 1) return;

            const existing = deckData[section].find(c => c.name.toLowerCase() === name.toLowerCase());
            if (existing) {
                existing.qty += qty;
            } else {
                deckData[section].push({
                    id: Date.now(),
                    name: name,
                    qty: qty
                });
            }

            closeAddModal();
            renderLists();
        }

        // Inizializzazione
        renderLists();
    </script>
</body>
</html>
